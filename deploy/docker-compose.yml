services:
  freqtrade:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: freqtrade-alerts
    restart: unless-stopped
    environment:
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    expose:
      - "8080"
    volumes:
      - ../user_data/data:/freqtrade/user_data/data
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
